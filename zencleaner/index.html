<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Cleaner</title>
<meta name="description" content="Zen Cleaner — an on-device iPhone utility to clean up similar photos, screenshots, large videos and duplicate contacts.">
<link rel="icon" href="/zencleaner/assets/icon.png">
<style>
:root {
  --accent: #2F80ED;
  --accent2: #56CCF2;
  --bg: #eef4ff;
  --bg2: #f7faff;
  --card: #ffffff;
  --text: #1a2433;
  --muted: #5b6b82;
  --border: #dce6f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #6aa8ff;
    --accent2: #56CCF2;
    --bg: #0b1017;
    --bg2: #10161f;
    --card: #151c27;
    --text: #e6edf7;
    --muted: #93a1b5;
    --border: #26313f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, "SF Pro Rounded", ui-rounded, "SF Pro Display",
               system-ui, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, var(--bg2) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  padding: 32px 20px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 44px 34px 36px;
  max-width: 440px; width: 100%;
  text-align: center;
  box-shadow: 0 18px 60px rgba(47, 128, 237, 0.12);
}
.icon {
  width: 112px; height: 112px; border-radius: 26px;
  display: block; margin: 0 auto 20px;
  box-shadow: 0 10px 28px rgba(47, 128, 237, 0.28);
}
h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
.tagline { color: var(--muted); font-size: 16px; margin: 0 auto 28px; max-width: 320px; line-height: 1.5; }
.links { display: flex; flex-direction: column; gap: 12px; }
.btn {
  display: block; text-decoration: none; font-weight: 600; font-size: 16px;
  padding: 15px 20px; border-radius: 16px;
  color: #fff;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 8px 20px rgba(47, 128, 237, 0.25);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(47, 128, 237, 0.32); }
.btn.secondary {
  color: var(--accent); background: transparent;
  border: 1.5px solid var(--border); box-shadow: none;
}
.btn.secondary:hover { border-color: var(--accent); box-shadow: none; }
.support { margin-top: 26px; font-size: 15px; color: var(--muted); }
.support a { color: var(--accent); text-decoration: none; font-weight: 600; }
.support a:hover { text-decoration: underline; }
.foot { margin-top: 6px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="/zencleaner/assets/icon.png" width="112" height="112" alt="Zen Cleaner app icon">
  <h1>Zen Cleaner</h1>
  <p class="tagline">Clean up similar photos, screenshots, large videos and duplicate contacts — entirely on your iPhone.</p>
  <nav class="links">
    <a class="btn" href="/zencleaner/privacy/">Privacy Policy</a>
    <a class="btn secondary" href="/zencleaner/terms/">Terms of Use</a>
  </nav>
  <p class="support">Support: <a href="mailto:support@zhongordei.dev">support@zhongordei.dev</a></p>
  <p class="foot">© 2026 Zen Cleaner</p>
</main>
</body>
</html>
